<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangalore House Price Prediction</title>
    <link rel="stylesheet" href="./app.css">
</head>
<body>
    <div class="container">
        <h1>Bangalore House Price Prediction</h1>
        
        <form id="predictionForm">
            <div class="form-group">
                <label for="location">Location:</label>
                <select id="location" name="location" required>
                    <option value="">Select Location</option>
                </select>
            </div>

            <div class="form-group">
                <label for="society">Society:</label>
                <select id="society" name="society" required>
                    <option value="">Select Society</option>
                </select>
            </div>

            <div class="form-group">
                <label for="area_type">Area Type:</label>
                <select id="area_type" name="area_type" required>
                    <option value="">Select Area Type</option>
                </select>
            </div>

            <div class="form-group">
                <label for="total_sqft">Total Square Feet:</label>
                <input type="number" id="total_sqft" name="total_sqft" min="100" step="1" required>
            </div>

            <div class="form-group">
                <label for="bhk">BHK:</label>
                <select id="bhk" name="bhk" required>
                    <option value="">Select BHK</option>
                    <option value="1">1 BHK</option>
                    <option value="2">2 BHK</option>
                    <option value="3">3 BHK</option>
                    <option value="4">4 BHK</option>
                    <option value="5">5 BHK</option>
                    <option value="6">6+ BHK</option>
                </select>
            </div>

            <div class="form-group">
                <label for="bath">Bathrooms:</label>
                <select id="bath" name="bath" required>
                    <option value="">Select Bathrooms</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5+</option>
                </select>
            </div>

            <div class="form-group">
                <label for="balcony">Balconies:</label>
                <select id="balcony" name="balcony" required>
                    <option value="">Select Balconies</option>
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4+</option>
                </select>
            </div>

            <button type="submit" class="btn-predict">Predict Price</button>
        </form>

        <div id="result" class="result hidden">
            <h2>Predicted Price</h2>
            <p id="price"></p>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
